<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Reel Film Clapper / Vertical Frame Shape -->
  <rect x="14" y="12" width="36" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Film Sprocket Dots (Top & Bottom) -->
  <circle cx="19" cy="17" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="27" cy="17" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="37" cy="17" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="45" cy="17" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />

  <circle cx="19" cy="47" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="27" cy="47" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="37" cy="47" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="45" cy="47" r="1.5" fill="#FFFFFF" fill-opacity="0.8" />

  <!-- Center Play Icon -->
  <path d="M27 24L41 32L27 40V24Z" fill="url(#glowGrad)" filter="url(#shadow)" />

  <!-- AI Sparkle in Top Right Corner -->
  <path d="M46 10C46 13.5 48.5 16 52 16C48.5 16 46 18.5 46 22C46 18.5 43.5 16 40 16C43.5 16 46 13.5 46 10Z" fill="#FDE047" />
</svg>
